<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Honeyicons" />
		<meta property="og:url" content="https://honeyicons.com" />
		<meta
			property="og:title"
			content="Honeyicons: React icons that all match"
		/>
		<meta
			property="og:description"
			content="Every icon has an outline and a filled version. Free to use, MIT licensed."
		/>
		<meta property="og:image" content="https://honeyicons.com/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="The Honeyicons logo and the words React icons that all match, beside a grid of icons."
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<script>
			(() => {
				try {
					const theme = localStorage.getItem("theme");
					const isDark =
						theme === "dark" ||
						(theme === "system" &&
							window.matchMedia("(prefers-color-scheme: dark)").matches);
					if (isDark) document.documentElement.classList.add("dark");
				} catch {}
			})();
		</script>
	</head>
	<body class="font-sans antialiased">
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
